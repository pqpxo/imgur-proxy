# version 4.0.1
name: swimgur

services:
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: swimgur-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: "private internet access"
      VPN_TYPE: openvpn
      OPENVPN_USER: "${PIA_USER:?Set PIA_USER in .env}"
      OPENVPN_PASSWORD: "${PIA_PASSWORD:?Set PIA_PASSWORD in .env}"
      SERVER_REGIONS: "${SERVER_REGIONS:-Netherlands}"
      FIREWALL_INPUT_PORTS: "443"
      DNS_UPSTREAM_RESOLVER_TYPE: DoT
      DNS_UPSTREAM_RESOLVERS: cloudflare
    volumes:
      - ./gluetun:/gluetun
    networks:
      macvlan:
        ipv4_address: "${PROXY_IP:?Set a free LAN IP in .env}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: swimgur-proxy:4.0.1
    container_name: swimgur-nginx
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    restart: unless-stopped

networks:
  macvlan:
    external: true
    name: "${MACVLAN_NETWORK:-swimgur-macvlan}"
