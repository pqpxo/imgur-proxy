# version 4.0.1
# SNI TLS passthrough; Gluetun handles VPN routing.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;
user nginx;
worker_processes auto;
error_log /dev/stderr info;
pid /run/nginx/nginx.pid;
events { worker_connections 1024; }
stream {
    resolver 127.0.0.1 valid=60s ipv6=off;
    resolver_timeout 5s;
    map $ssl_preread_server_name $target {
        imgur.com     "imgur.com:443";
        www.imgur.com "www.imgur.com:443";
        i.imgur.com   "i.imgur.com:443";
        s.imgur.com   "s.imgur.com:443";
        api.imgur.com "api.imgur.com:443";
        default       "127.0.0.1:9";
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $target;
        proxy_connect_timeout 10s;
        proxy_timeout 90s;
    }
}
